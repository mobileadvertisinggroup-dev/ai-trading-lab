# AKRA AI TRADING LAB — Phase 2 data ingestion (HOLDOUT_POLICY.md §6 rules).
# Manual-only. Paper-only project; no trading credentials exist anywhere.
# Least privilege: contents:write is required solely to upload release
# assets (lake + encrypted holdout) and push metadata-only manifests.
name: lab-ingest
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (verify parser assumptions), full ingestion, or post-ingestion coverage audit"
        required: true
        default: probe
        type: choice
        options: [probe, full, audit]
      release_version:
        description: "immutable data release tag (raw-vN)"
        required: true
        default: raw-v1

concurrency:
  group: lab-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # SHA-pinned (review verdict §5.1). Provenance: resolved via
      # `git ls-remote https://github.com/actions/<name> refs/tags/<tag>`
      # on 2026-08-25 through the session git proxy:
      #   actions/checkout v4.3.0  -> 08eba0b27e820071cde6df949e0beb9ba4906955
      #   actions/setup-python v5.6.0 -> a26af69be951a213d495a4c3e4e4022e16d87065
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run dev test suite (gate)
        run: python -m pytest tests/ -q
      - name: Probe (parser/source assumptions, non-holdout 2021 sample)
        if: inputs.mode == 'probe'
        run: python -m lab.data.ingest --probe
      - name: Capture immutable-release evidence (delta corr. A)
        if: inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Authoritative check: GET /repos/{owner}/{repo}/immutable-releases
          # 200 => enabled; 404 => not enabled or unavailable to the token;
          # anything else => UNVERIFIED (never inferred as enabled). Until a
          # successful 200, rely only on tamper-evident git-pinned hashes.
          set -uo pipefail
          mkdir -p data/manifests
          BODY="$RUNNER_TEMP/imm_body.json"
          ERRF="$RUNNER_TEMP/imm_err.txt"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/immutable-releases" > "$BODY" 2> "$ERRF"
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            STATUS="200"
            INTERP="ENABLED: immutable releases are enabled for this repository"
          elif grep -q "HTTP 404" "$ERRF"; then
            STATUS="404"
            INTERP="NOT ENABLED (or unavailable to this token): continue relying on tamper-evident git-pinned hashes"
          else
            STATUS="unknown"
            INTERP="UNVERIFIED: permission or API ambiguity - never inferred as enabled; continue relying on tamper-evident git-pinned hashes"
          fi
          python3 -m lab.tools.immutable_evidence \
            "$STATUS" "$BODY" "$INTERP" \
            "data/manifests/immutable_release_evidence_${{ inputs.release_version }}.json"
      - name: Full ingestion + seal (acquisition staging per PC-1)
        if: inputs.mode == 'full'
        run: |
          # PC-1 protections: staging lives in RUNNER_TEMP (outside the
          # checkout -> can never be committed), is never uploaded as an
          # artifact, never cached, and is verifiably destroyed below.
          python -m lab.data.ingest \
            --out-dir "$RUNNER_TEMP/work" \
            --manifests-dir data/manifests \
            --release-version "${{ inputs.release_version }}"
      - name: Bundle plaintext lake (release assets, never git)
        if: inputs.mode == 'full'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/work"
          tar --zstd -cf lake-${{ inputs.release_version }}.tar.zst lake
          split -b 1900m -d lake-${{ inputs.release_version }}.tar.zst \
            lake-${{ inputs.release_version }}.tar.zst.part
          rm lake-${{ inputs.release_version }}.tar.zst
          sha256sum lake-*.part* holdout-*.tar.age > SHA256SUMS
      - name: Release transaction (verdict §5.2 order)
        if: inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh must know the repo even from directories outside the
          # checkout (RUNNER_TEMP/verify) — full run 2 failed here.
          export GH_REPO="$GITHUB_REPOSITORY"
          V="${{ inputs.release_version }}"
          # PUBLISHED release with this tag => never overwritten (§3).
          # A leftover DRAFT from a previously failed transaction is
          # explicitly unofficial (§5.2 order) and is deleted before retry.
          PUB=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q "[.[] | select(.tag_name==\"$V\" and (.draft|not))] | length")
          if [ "$PUB" != "0" ]; then
            echo "release $V already published — data releases are never overwritten (HOLDOUT_POLICY §3); bump the version" >&2
            exit 1
          fi
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select(.tag_name==\"$V\" and .draft) | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "deleted leftover unofficial DRAFT release $id for $V"
          done
          # (1) DRAFT release — a partial upload is never visible as published
          gh release create "${{ inputs.release_version }}" \
            --draft \
            --title "Raw data ${{ inputs.release_version }}" \
            --notes "Content-hashed raw lake + sealed holdout artifact. Tamper-evident: verify every asset against data/manifests/lake_manifest_${{ inputs.release_version }}.json and SHA256SUMS (pinned in git)."
          # (2) upload ALL assets
          gh release upload "${{ inputs.release_version }}" \
            "$RUNNER_TEMP"/work/lake-*.part* \
            "$RUNNER_TEMP"/work/holdout-*.tar.age \
            "$RUNNER_TEMP"/work/SHA256SUMS
          # (3) verify every uploaded asset hash against local SHA256SUMS
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          gh release download "${{ inputs.release_version }}" -p '*'
          sha256sum -c "$RUNNER_TEMP"/work/SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          # (4) commit + push manifests; ONLY a successful push allows publish
          git config user.name "akra-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/manifests
          git commit -m "ingestion ${{ inputs.release_version }}: partition + seal + lake manifests + release evidence (metadata only)"
          git pull --rebase origin main
          git push
          # (5) publish — reached only if every prior step succeeded;
          # on any failure above the release remains an unofficial draft
          gh release edit "${{ inputs.release_version }}" --draft=false
      - name: Coverage audit (user directive 2026-08-26; acceptance gate)
        if: inputs.mode == 'audit'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Downloads the PUBLISHED release, verifies every asset hash and
          # every lake file against the git-pinned manifest, audits
          # coverage per symbol with archive probing, preserves the audit
          # + its sha256 in the dataset manifest, and pushes both. A
          # FAIL_COVERAGE_LOSS verdict fails this job AFTER the audit and
          # verdict are committed: the release is then NOT accepted for
          # training and a corrected new data version is required.
          set -euo pipefail
          export GH_REPO="$GITHUB_REPOSITORY"   # gh outside the checkout
          V="${{ inputs.release_version }}"
          mkdir -p "$RUNNER_TEMP/audit" && cd "$RUNNER_TEMP/audit"
          gh release download "$V" -p '*'
          sha256sum -c SHA256SUMS
          cat lake-$V.tar.zst.part* > lake.tar.zst
          tar --zstd -xf lake.tar.zst
          cd "$GITHUB_WORKSPACE"
          set +e
          python -m lab.data.audit \
            --lake "$RUNNER_TEMP/audit/lake" \
            --manifests-dir data/manifests \
            --release-version "$V" \
            --verify-manifest
          RC=$?
          set -e
          git config user.name "akra-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/manifests
          git commit -m "coverage audit $V: audit + verdict + manifest addendum (metadata only)"
          git pull --rebase origin main
          git push
          exit $RC
      - name: Verified destruction of audit staging
        if: always() && inputs.mode == 'audit'
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/audit"
          if [ -e "$RUNNER_TEMP/audit" ]; then
            echo "FATAL: audit staging still present after destruction" >&2
            exit 1
          fi
          echo "audit staging destroyed and verified absent"
      - name: Verified destruction of acquisition staging (PC-1)
        if: always() && inputs.mode == 'full'
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/work" "$RUNNER_TEMP/verify"
          if [ -e "$RUNNER_TEMP/work" ] || [ -e "$RUNNER_TEMP/verify" ]; then
            echo "FATAL: acquisition staging still present after destruction" >&2
            exit 1
          fi
          echo "acquisition staging destroyed and verified absent"
