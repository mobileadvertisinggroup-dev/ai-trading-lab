# AKRA AI TRADING LAB — Phase 2 data ingestion (HOLDOUT_POLICY.md §6 rules).
# Manual-only. Paper-only project; no trading credentials exist anywhere.
# Least privilege: contents:write is required solely to upload release
# assets (lake + encrypted holdout) and push metadata-only manifests.
name: lab-ingest
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (verify parser assumptions) or full ingestion"
        required: true
        default: probe
        type: choice
        options: [probe, full]
      release_version:
        description: "immutable data release tag (raw-vN)"
        required: true
        default: raw-v1

concurrency:
  group: lab-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run dev test suite (gate)
        run: python -m pytest tests/ -q
      - name: Probe (parser/source assumptions, non-holdout 2021 sample)
        if: inputs.mode == 'probe'
        run: python -m lab.data.ingest --probe
      - name: Full ingestion + seal
        if: inputs.mode == 'full'
        run: |
          python -m lab.data.ingest \
            --out-dir "$RUNNER_TEMP/work" \
            --manifests-dir data/manifests \
            --release-version "${{ inputs.release_version }}"
      - name: Bundle plaintext lake (release assets, never git)
        if: inputs.mode == 'full'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/work"
          tar --zstd -cf lake-${{ inputs.release_version }}.tar.zst lake
          split -b 1900m -d lake-${{ inputs.release_version }}.tar.zst \
            lake-${{ inputs.release_version }}.tar.zst.part
          rm lake-${{ inputs.release_version }}.tar.zst
          sha256sum lake-*.part* holdout-*.tar.age > SHA256SUMS
      - name: Publish immutable data release
        if: inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ inputs.release_version }}" >/dev/null 2>&1; then
            echo "release ${{ inputs.release_version }} already exists — data releases are immutable (HOLDOUT_POLICY §3); bump the version" >&2
            exit 1
          fi
          gh release create "${{ inputs.release_version }}" \
            --title "Raw data ${{ inputs.release_version }}" \
            --notes "Immutable content-hashed raw lake + sealed holdout artifact. Verify against data/manifests/lake_manifest_${{ inputs.release_version }}.json." \
            "$RUNNER_TEMP"/work/lake-*.part* \
            "$RUNNER_TEMP"/work/holdout-*.tar.age \
            "$RUNNER_TEMP"/work/SHA256SUMS
      - name: Commit metadata-only manifests
        if: inputs.mode == 'full'
        run: |
          set -euo pipefail
          git config user.name "akra-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/manifests
          git commit -m "ingestion ${{ inputs.release_version }}: partition + seal + lake manifests (metadata only)"
          git pull --rebase origin main
          git push
